# Keeps ruff + ty and GitHub Actions current as ONE grouped PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    allow:
      - dependency-name: ruff
      - dependency-name: ty
    groups:
      astral-tools:
        patterns: ["ruff", "ty"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
