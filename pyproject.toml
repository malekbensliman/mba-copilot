[project]
name = "mba-copilot"
version = "1.0.0"
description = "Personal AI copilot for MBA students - RAG-powered document Q&A"
authors = [{ name = "Malek Ben Sliman", email = "malekbensliman@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0,<0.110.0",
    "uvicorn[standard]>=0.27.0,<0.28.0",
    "openai>=1.12.0,<2.0.0",
    "pinecone-client>=3.0.0,<4.0.0",
    "python-multipart>=0.0.6,<0.0.7",
    "pymupdf>=1.23.0,<2.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-pptx>=1.0.2,<2.0.0",
    "tiktoken>=0.12.0,<1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.3",
    "pytest>=9.0.3",
    "ty>=0.0.40",
]

[tool.pyright]
# VSCode uses pyright out of the box; we disable it and use ty for type checking
typeCheckingMode = "off"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serverless"]

[tool.ruff]
target-version = "py312"
extend-include = ["*.ipynb"]
exclude = [".git", "__pycache__", "archive", ".ipython"]
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "E501"]
select = [
    "D", # pydocstyle
    "E", # Pep8
    "W", # Pep8
    "F", # Flake8
    "RUF", # Ruff-specific Rules
    "N", # Pep8-Naming
    "C9", # McCabe Complexity
    "I", # Isort
    "B", # Bugbear
    "T10", # Debugger
    "TCH", # Typecheck Imports

]
fixable = [
    "RUF", # Ruff-specific Rules
    "I", # Isort
    "TCH", # Typecheck Imports
    "D", #pydocstyle
    "F401", # unused imports

]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.ipynb" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
